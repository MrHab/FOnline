# Include these locations inside the HTTPS server block for rangir.ru.
# Static files are served by Nginx; only dynamic HTTP and Socket.IO traffic
# reaches the Node.js process on 127.0.0.1:3000.

# Large world snapshots are highly compressible JSON. Without this block a
# traveling client repeatedly transfers hundreds of kilobytes of plain text
# and can delay the latency-sensitive WebSocket stream on slower connections.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types application/json application/javascript text/css text/plain image/svg+xml;

location = /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~* ^/api/dev(?:/|$) {
    return 404;
}

location ~* ^/dev-(?:location|global-map)-editor\.html$ {
    return 404;
}

location ~ ^/api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
}

location = /index.html {
    root /opt/realm-of-ashes/public;
    add_header Cache-Control "no-cache";
}

location = /js/game.js {
    root /opt/realm-of-ashes/public;
    add_header Cache-Control "no-cache";
}

location = /css/game.css {
    root /opt/realm-of-ashes/public;
    add_header Cache-Control "no-cache";
}

location ~* \.(?:avif|css|gif|glb|ico|jpe?g|js|json|mp3|ogg|png|svg|webp|woff2?)$ {
    root /opt/realm-of-ashes/public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location / {
    root /opt/realm-of-ashes/public;
    try_files $uri $uri/ /index.html;
}
