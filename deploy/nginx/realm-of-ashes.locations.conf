# Include these locations inside the HTTPS server block for rangir.ru.
#
# ВАЖНО: включите HTTP/2 в самом server-блоке — "listen 443 ssl;" плюс
# "http2 on;" (или "listen 443 ssl http2;" на nginx старше 1.25.1).
# Клиент загружает страницу под сотню файлов. По HTTP/1.1 браузер держит к
# одному хосту около шести соединений, и запрос входа встаёт в очередь за
# статикой: сам вход на сервере занимает меньше сотни миллисекунд, а игроку
# это выглядит как зависание после нажатия «Войти». HTTP/2 мультиплексирует
# запросы в одно соединение и убирает очередь целиком.
# Static files are served by Nginx; only dynamic HTTP and Socket.IO traffic
# reaches the Node.js process on 127.0.0.1:3000.

# Large world snapshots are highly compressible JSON. Without this block a
# traveling client repeatedly transfers hundreds of kilobytes of plain text
# and can delay the latency-sensitive WebSocket stream on slower connections.
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
# Binary glTF files produced by our generators still contain highly
# compressible geometry, animation tracks and JSON metadata. Let HTTP gzip
# shrink them in transit; the browser transparently restores the original GLB
# before GLTFLoader sees it, so skeletons and animation data stay byte-exact.
gzip_types application/json application/javascript text/css text/plain image/svg+xml model/gltf-binary application/octet-stream;

location = /health {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~* ^/api/dev(?:/|$) {
    return 404;
}

location ~ ^/api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /socket.io/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
}

# Клиент игры — только Unity WebGL из public/unity/ (собирается при деплое, см.
# docs/UNITY_PORT.md «Деплой»). Корень сайта отдаёт его страницу, а без сборки —
# страницу ожидания.
location = / {
    root /opt/realm-of-ashes/public;
    try_files /unity/index.html /unity-unavailable.html;
    add_header Cache-Control "no-cache";
}

location = /unity/index.html {
    root /opt/realm-of-ashes/public;
    add_header Cache-Control "no-cache";
}

# Файлы сборки названы хэшами содержимого — кеш навсегда. Сборка сжата Brotli
# (меню «Кромка → Build WebGL»), но Unity не пишет кодек в имя `.unityweb`,
# поэтому кодек объявляется по расширению `.unityweb` и только клиенту, который
# brotli принимает. Остальным достаётся тот же файл без заголовка, и его
# распакует загрузчик Unity (decompressionFallback). Без заголовка
# 280-мегабайтный `.data` распаковывается на JavaScript — минуты ожидания на
# первом заходе.
#
# Блоков четыре, потому что nginx сопоставляет тип по последнему расширению, а
# у сборки оно всегда `.unityweb`. Регулярные location проверяются раньше
# префиксного (у него намеренно нет `^~`), а `loader.js` лежит несжатым и
# поэтому в последний блок попадает без Content-Encoding.
#
# add_header внутри `if` заменяет внешние, поэтому они повторены целиком.
location ~* ^/unity/Build/.+\.wasm\.unityweb$ {
    root /opt/realm-of-ashes/public;
    try_files $uri =404;
    # Тип нужен точный: с ним браузер компилирует модуль потоком, без него
    # держит все 60 МБ в памяти перед компиляцией.
    default_type application/wasm;
    gzip off;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    if ($http_accept_encoding ~* "\bbr\b") {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        add_header Content-Encoding "br";
    }
}

location ~* ^/unity/Build/.+\.js\.unityweb$ {
    root /opt/realm-of-ashes/public;
    try_files $uri =404;
    default_type application/javascript;
    gzip off;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    if ($http_accept_encoding ~* "\bbr\b") {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        add_header Content-Encoding "br";
    }
}

location ~* ^/unity/Build/.+\.unityweb$ {
    root /opt/realm-of-ashes/public;
    try_files $uri =404;
    default_type application/octet-stream;
    gzip off;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Vary "Accept-Encoding";
    if ($http_accept_encoding ~* "\bbr\b") {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
        add_header Content-Encoding "br";
    }
}

location /unity/Build/ {
    root /opt/realm-of-ashes/public;
    try_files $uri =404;
    types { application/wasm wasm; application/javascript js; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable";
    gzip off;
    access_log off;
}

# Облегчённые GLB (npm run build:models-lite → public/assets/models-lite/); если
# копии нет — оригинал из public/assets/models/.
location ^~ /assets/models-lite/ {
    root /opt/realm-of-ashes/public;
    try_files $uri @models_original;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location @models_original {
    root /opt/realm-of-ashes/public;
    rewrite ^/assets/models-lite/(.*)$ /assets/models/$1 last;
}

location ~* \.(?:avif|css|gif|glb|ico|jpe?g|js|json|mp3|ogg|png|svg|webp|woff2?)$ {
    root /opt/realm-of-ashes/public;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location / {
    root /opt/realm-of-ashes/public;
    try_files $uri $uri/ /unity-unavailable.html;
}
