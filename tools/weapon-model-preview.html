<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Realm of Ashes — проверка оружия</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #121715; color: #e7d6a4; display: grid; place-items: center; }
    main { width: min(1100px, 100%); padding: 18px; }
    h1 { margin: 0 0 5px; font-size: clamp(18px, 3vw, 29px); letter-spacing: .08em; text-transform: uppercase; }
    p { margin: 0 0 14px; color: #9eaa9e; }
    .viewer { border: 1px solid #7f6b3d; border-radius: 10px; overflow: hidden; background: #202925; box-shadow: 0 20px 60px #0008; }
    canvas { display: block; width: 100%; height: min(66vh, 660px); touch-action: none; }
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 10px; background: #151b18; border-top: 1px solid #5c5133; }
    button { min-height: 40px; padding: 8px 14px; border: 1px solid #756640; border-radius: 5px; color: #eedb9f; background: #27312c; font-weight: 700; cursor: pointer; }
    button:hover { background: #344139; }
    #weapon-name { flex: 1; text-align: center; font-weight: 800; letter-spacing: .06em; }
    #status { font-size: 12px; color: #8fae98; text-align: right; }
    @media (max-width: 900px) and (orientation: landscape) {
      main { padding: 6px; }
      h1, p { display: none; }
      canvas { height: calc(100vh - 66px); }
      .toolbar { padding: 5px; gap: 5px; }
      button { min-height: 38px; padding: 6px 10px; }
      #status { display: none; }
      #weapon-name { min-width: 92px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Библиотека оружия B+C</h1>
    <p>Проверка геометрии, материалов и встроенных клипов без запуска игрового мира.</p>
    <section class="viewer">
      <canvas id="preview" aria-label="Трёхмерный предпросмотр оружия"></canvas>
      <div class="toolbar">
        <button id="previous" aria-label="Предыдущее оружие">←</button>
        <div id="weapon-name">загрузка…</div>
        <button id="next" aria-label="Следующее оружие">→</button>
        <button data-animation="idle">Ожидание</button>
        <button data-animation="attack">Атака</button>
        <button data-animation="reload">Перезарядка</button>
        <span id="status"></span>
      </div>
    </section>
  </main>
  <script src="/public/vendor/three.min.js"></script>
  <script src="/public/vendor/GLTFLoader.js"></script>
  <script>
    const manifestUrl = '/public/assets/models/weapons/manifest.json';
    const canvas = document.getElementById('preview');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x27312d);
    scene.fog = new THREE.Fog(0x27312d, 7, 16);
    const camera = new THREE.PerspectiveCamera(34, 1, 0.05, 60);
    const hemi = new THREE.HemisphereLight(0xc9d7c5, 0x2a241a, 1.45);
    scene.add(hemi);
    const key = new THREE.DirectionalLight(0xffe5ae, 2.1);
    key.position.set(-3, 6, 4);
    key.castShadow = true;
    scene.add(key);
    const rim = new THREE.DirectionalLight(0x86c5b1, 1.0);
    rim.position.set(4, 2, -4);
    scene.add(rim);
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(4.5, 48),
      new THREE.MeshStandardMaterial({ color: 0x39443d, roughness: 0.96 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const loader = new THREE.GLTFLoader();
    const clock = new THREE.Clock();
    const cache = new Map();
    let catalog = [];
    let index = 0;
    let active = null;
    let mixer = null;
    let clips = new Map();
    let dragX = 0;
    let dragging = false;
    let pointerX = 0;

    function resize() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const scale = Math.min(1.5, window.devicePixelRatio || 1);
      renderer.setPixelRatio(scale);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }

    function loadFile(row) {
      if (cache.has(row.id)) return Promise.resolve(cache.get(row.id));
      return new Promise((resolve, reject) => {
        loader.load(`/public${row.file}`, gltf => {
          cache.set(row.id, gltf);
          resolve(gltf);
        }, undefined, reject);
      });
    }

    function frameModel(root) {
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);
      root.position.sub(center);
      root.position.y += Math.max(0.06, size.y * 0.08);
      const radius = Math.max(size.x, size.y, size.z, 0.5);
      camera.position.set(radius * 1.65, radius * 1.28, radius * 2.15);
      camera.lookAt(0, radius * 0.08, 0);
      camera.near = Math.max(0.02, radius * 0.02);
      camera.far = radius * 15;
      camera.updateProjectionMatrix();
    }

    function playAnimation(name) {
      if (!mixer || !clips.has(name)) return;
      mixer.stopAllAction();
      const action = mixer.clipAction(clips.get(name));
      action.reset();
      action.setLoop(name === 'idle' ? THREE.LoopRepeat : THREE.LoopOnce, name === 'idle' ? Infinity : 1);
      action.clampWhenFinished = name !== 'idle';
      action.play();
      document.getElementById('status').textContent = `клип: ${name}`;
    }

    async function showWeapon(nextIndex) {
      index = (nextIndex + catalog.length) % catalog.length;
      const row = catalog[index];
      document.getElementById('weapon-name').textContent = row.id;
      document.getElementById('status').textContent = 'загрузка GLB…';
      const gltf = await loadFile(row);
      if (active) scene.remove(active);
      active = gltf.scene.clone(true);
      active.rotation.y = dragX;
      active.traverse(object => {
        object.frustumCulled = false;
        if (object.isMesh) {
          object.castShadow = true;
          object.receiveShadow = false;
        }
      });
      scene.add(active);
      frameModel(active);
      mixer = new THREE.AnimationMixer(active);
      clips = new Map(gltf.animations.map(clip => [clip.name, clip]));
      document.getElementById('status').textContent = `${row.meshes} мешей · ${Math.round(row.bytes / 1024)} КБ`;
      playAnimation('idle');
    }

    document.getElementById('previous').addEventListener('click', () => showWeapon(index - 1));
    document.getElementById('next').addEventListener('click', () => showWeapon(index + 1));
    document.querySelectorAll('[data-animation]').forEach(button => {
      button.addEventListener('click', () => playAnimation(button.dataset.animation));
    });
    canvas.addEventListener('pointerdown', event => {
      dragging = true;
      pointerX = event.clientX;
      canvas.setPointerCapture(event.pointerId);
    });
    canvas.addEventListener('pointermove', event => {
      if (!dragging || !active) return;
      dragX += (event.clientX - pointerX) * 0.012;
      pointerX = event.clientX;
      active.rotation.y = dragX;
    });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    window.addEventListener('resize', resize);

    function loop() {
      requestAnimationFrame(loop);
      resize();
      const dt = Math.min(0.05, clock.getDelta());
      if (mixer) mixer.update(dt);
      renderer.render(scene, camera);
    }
    fetch(manifestUrl)
      .then(response => response.json())
      .then(manifest => {
        catalog = manifest.files;
        return showWeapon(0);
      })
      .catch(error => {
        document.getElementById('weapon-name').textContent = 'ошибка загрузки';
        document.getElementById('status').textContent = error.message;
      });
    loop();
  </script>
</body>
</html>
