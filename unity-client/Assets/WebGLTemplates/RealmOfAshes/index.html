<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Realm of Ashes — Unity</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0806; }
      #unity-canvas { display: block; width: 100vw; height: 100vh; background: #0a0806; }
      #roa-loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 45%, rgba(119, 74, 34, 0.24), transparent 38%), linear-gradient(180deg, #0a0806, #060504 72%, #030302);
        font-family: Arial, sans-serif; color: #f0d9a2;
      }
      #roa-loading .card { width: min(520px, 92vw); padding: 26px 28px 24px; border: 2px solid rgba(233, 186, 104, 0.34); border-radius: 18px; background: linear-gradient(135deg, rgba(83, 59, 36, 0.95), rgba(32, 27, 22, 0.98) 44%, rgba(17, 16, 14, 0.98)); text-align: center; }
      #roa-loading .kicker { font: 700 11px/1.2 Arial, sans-serif; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(250, 205, 119, 0.72); margin-bottom: 12px; }
      #roa-loading h1 { font-family: Georgia, serif; font-size: 32px; margin: 0 0 10px; }
      #roa-loading .sub { color: rgba(236, 220, 176, 0.86); font-size: 14px; margin-bottom: 22px; }
      #roa-loading .bar { height: 16px; border-radius: 999px; overflow: hidden; border: 1px solid rgba(245, 204, 126, 0.28); background: rgba(10, 8, 6, 0.62); }
      #roa-loading .fill { width: 0%; height: 100%; background: linear-gradient(90deg, #7c4a22, #c98638 54%, #f0c06c); transition: width 170ms ease; }
      #roa-loading .step { margin-top: 14px; font-size: 13px; color: rgba(245, 217, 160, 0.82); }
      #roa-loading .hint { margin: 18px auto 0; max-width: 420px; font-size: 12px; line-height: 1.45; color: rgba(211, 187, 137, 0.58); }
      #roa-error { display: none; position: fixed; left: 50%; top: 12px; transform: translateX(-50%); padding: 10px 14px; background: #5a1c1c; color: #fff; font: 13px Arial, sans-serif; border-radius: 6px; z-index: 10; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="roa-loading">
      <div class="card">
        <div class="kicker">Вход в игру</div>
        <h1>Realm of Ashes</h1>
        <div class="sub">Unity-клиент в браузере</div>
        <div class="bar"><div class="fill" id="roa-fill"></div></div>
        <div class="step" id="roa-step">Загружаю движок...</div>
        <div class="hint">Первый запуск скачивает около 20 МБ; дальше файлы берутся из кеша браузера.</div>
      </div>
    </div>
    <div id="roa-error"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var box = document.querySelector("#roa-error");
        box.textContent = msg;
        box.style.display = "block";
        if (type !== "error") setTimeout(function () { box.style.display = "none"; }, 5000);
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
        memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner
      };
      // На телефонах рендер в полном DPR (2–3×) слишком дорог: ограничиваем 1.5, как делают мобильные WebGL-игры.
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
      var script = document.createElement("script");
      script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
      script.onload = function () {
        document.querySelector("#roa-step").textContent = "Загружаю сборку...";
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#roa-fill").style.width = Math.round(progress * 100) + "%";
          if (progress >= 0.9) document.querySelector("#roa-step").textContent = "Запускаю мир...";
        }).then(function (unityInstance) {
          document.querySelector("#roa-loading").style.display = "none";
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
